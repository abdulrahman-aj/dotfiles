general.import = [
    "~/.config/alacritty/colors-dark-modern.toml",
    "~/.local/state/omarchy/current/theme/alacritty.toml",
]

# Window
[window]
decorations = "None"
opacity = 1.0
padding = { x = 12, y = 12 }

# Typography
[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 10.0

# Cursor
[cursor]
style = { shape = "Block", blinking = "Off" }

# Scrollback
[scrolling]
history = 3023

# Mouse
[mouse]
hide_when_typing = true

# Selection
[selection]
save_to_clipboard = false

# Key bindings (Alacritty has no tabs/splits — niri tiles windows)
[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "CreateNewWindow"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\n"
